<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You | TREVS DESIGN</title>
  <style>
    :root { --forest: #123b2d; --green: #1f8f55; --mint: #dff8df; --paper: #f5fbf3; --lime: #c9f36b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: var(--forest); background: linear-gradient(135deg, var(--mint), var(--paper)); font-family: Arial, sans-serif; }
    .thank-you { width: min(620px, calc(100% - 36px)); padding: 56px 34px; text-align: center; background: rgba(255,255,255,.9); border: 1px solid rgba(18,59,45,.12); box-shadow: 0 24px 70px rgba(18,59,45,.12); }
    .check { display: inline-grid; width: 72px; height: 72px; place-items: center; margin-bottom: 24px; color: var(--forest); background: var(--lime); border-radius: 50%; font-size: 38px; font-weight: 800; }
    .eyebrow { margin: 0 0 16px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 20px; font-size: clamp(38px, 8vw, 70px); line-height: .94; letter-spacing: -.07em; }
    p { color: #587064; line-height: 1.75; }
    .home { display: inline-block; margin-top: 24px; padding: 15px 20px; color: white; background: var(--forest); font-size: 13px; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main class="thank-you">
    <div class="check" aria-hidden="true">✓</div>
    <p class="eyebrow">TREVS DESIGN / PAYMENT RECEIVED</p>
    <h1>Thank you, valued customer.</h1>
    <p>Your work has been sent to the TREVS DESIGN team and will be ready soon. We appreciate your trust and look forward to creating something great for you.</p>
    <a class="home" href="index.html">Return to homepage</a>
  </main>
</body>
</html>
