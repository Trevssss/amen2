<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment | TREVS DESIGN</title>
  <style>
    :root { --forest: #123b2d; --green: #1f8f55; --mint: #dff8df; --lime: #c9f36b; --paper: #f5fbf3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: var(--forest); background: linear-gradient(135deg, var(--mint), var(--paper)); font-family: Arial, sans-serif; }
    .payment-card { width: min(560px, calc(100% - 36px)); padding: 52px 38px; text-align: center; background: rgba(255,255,255,.82); border: 1px solid rgba(18,59,45,.12); box-shadow: 0 24px 70px rgba(18,59,45,.12); }
    .mark { display: inline-grid; width: 54px; height: 54px; place-items: center; margin-bottom: 22px; color: white; background: var(--green); border-radius: 50%; font-weight: 800; }
    .eyebrow { margin: 0 0 16px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 16px; font-size: clamp(34px, 7vw, 58px); letter-spacing: -.06em; }
    p { color: #587064; line-height: 1.7; }
    .method { display: block; margin-top: 30px; padding: 20px 22px; color: white; background: var(--forest); font-weight: 700; text-decoration: none; transition: box-shadow .3s ease, transform .3s ease; }
    .method:hover { box-shadow: 8px 8px 0 var(--lime); transform: translateY(-3px); }
    .back { display: inline-block; margin-top: 24px; color: var(--green); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
    .home { display: inline-block; margin: 24px 0 0 18px; color: var(--green); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main class="payment-card">
    <div class="mark">TD</div>
    <p class="eyebrow">TREVS DESIGN / PAYMENT</p>
    <h1>How do you pay?</h1>
    <p>Your enquiry is ready. Select a payment method below to continue.</p>
    <a class="method" href="bank-transfer.html">Bank transfer</a>
    <a class="back" href="enquiry.html">Back to enquiry</a>
    <a class="home" href="index.html">Home</a>
  </main>
</body>
</html>
