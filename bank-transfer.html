<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Transfer | TREVS DESIGN</title>
  <style>
    :root { --forest: #123b2d; --green: #1f8f55; --mint: #dff8df; --paper: #f5fbf3; --lime: #c9f36b; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: var(--forest); background: linear-gradient(135deg, var(--mint), var(--paper)); font-family: Arial, sans-serif; }
    .bank-card { width: min(560px, calc(100% - 36px)); padding: 44px 32px; text-align: center; background: rgba(255,255,255,.9); border: 1px solid rgba(18,59,45,.12); box-shadow: 0 24px 70px rgba(18,59,45,.12); }
    .eyebrow { margin: 0 0 14px; color: var(--green); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 30px; font-size: clamp(34px, 7vw, 58px); letter-spacing: -.06em; }
    .account { padding: 28px 20px; background: var(--forest); color: white; }
    .account-label { margin: 0 0 10px; color: var(--lime); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .account-number-row { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 24px; }
    .account-number { margin: 0; font-size: clamp(30px, 7vw, 48px); font-weight: 800; letter-spacing: .04em; }
    .account-name, .bank-name { margin: 8px 0; font-size: 17px; font-weight: 700; }
    .bank-name { color: var(--lime); font-size: 14px; letter-spacing: .08em; }
    .copy-icon { display: inline-grid; width: 38px; height: 38px; place-items: center; color: var(--forest); background: var(--lime); border: 0; border-radius: 50%; cursor: pointer; transition: box-shadow .25s ease, transform .25s ease; }
    .copy-icon:hover { box-shadow: 4px 4px 0 rgba(201,243,107,.45); transform: translateY(-2px); }
    .copy-icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .status { min-height: 18px; margin: 12px 0 0; color: var(--green); font-size: 12px; }
    .payment-link { display: block; margin-top: 28px; padding: 14px; color: white; background: var(--green); font-weight: 700; text-align: center; text-decoration: none; }
    .back { display: inline-block; margin-top: 25px; color: var(--green); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
    .home { display: inline-block; margin: 25px 0 0 18px; color: var(--green); font-size: 13px; text-decoration: underline; text-underline-offset: 4px; }
  </style>
</head>
<body>
  <main class="bank-card">
    <p class="eyebrow">TREVS DESIGN / BANK TRANSFER</p>
    <h1>Payment details</h1>
    <section class="account">
      <div class="account-number-row"><p class="account-number" id="account-number">5174477903</p><button class="copy-icon" id="copy-account" type="button" aria-label="Copy account number" title="Copy account number"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="1"></rect><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"></path></svg></button></div>
      <p class="account-name">FAITHWIN NGOZI ORJI</p>
      <p class="bank-name">MONIEPOINT MICROFINANCE BANK</p>
    </section>
    <p class="status" id="copy-status" aria-live="polite"></p>
    <p>After making your transfer, open the confirmation form and enter your name and email. The message will be set to “I have sent the money”.</p>
    <a class="payment-link" id="payment-link" href="https://formsubmit.co/el/bufelu?subject=TREVS%20DESIGN%20payment%20confirmation&amp;message=I%20have%20sent%20the%20money">I have sent the money</a>
    <a class="back" href="payment.html">Back to payment methods</a>
    <a class="home" href="index.html">Home</a>
  </main>
  <script>
    const copyButton = document.querySelector('#copy-account');
    const copyStatus = document.querySelector('#copy-status');
    copyButton.addEventListener('click', async () => {
      await navigator.clipboard.writeText('5174477903');
      copyStatus.textContent = 'Account number copied.';
    });
    const paymentLink = document.querySelector('#payment-link');
    if (window.location.protocol === 'http:' || window.location.protocol === 'https:') {
      const thankYouUrl = new URL('thank-you.html', window.location.href);
      const formUrl = new URL(paymentLink.href);
      formUrl.searchParams.set('next', thankYouUrl.href);
      paymentLink.href = formUrl.href;
    }
  </script>
</body>
</html>
