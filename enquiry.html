<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Send an Enquiry | TREVS DESIGN</title>
  <style>
    :root { --ink: #172522; --paper: #f4f0e8; --lime: #d8f85f; --coral: #ff765f; --muted: #66726e; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; color: var(--ink); background: var(--paper); font-family: Arial, sans-serif; }
    .card { width: min(620px, calc(100% - 36px)); padding: 42px; background: #fbfaf5; box-shadow: 12px 12px 0 var(--lime); }
    .eyebrow { margin: 0 0 16px; color: var(--coral); font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: clamp(38px, 8vw, 70px); line-height: .95; letter-spacing: -.07em; }
    p { color: var(--muted); line-height: 1.7; }
    form { display: grid; gap: 16px; margin-top: 26px; }
    label { display: grid; gap: 7px; font-size: 13px; font-weight: 700; }
    input, select, textarea { width: 100%; padding: 12px; color: var(--ink); background: white; border: 1px solid #cbd0c8; border-radius: 0; font: inherit; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--coral); outline-offset: 2px; }
    textarea { min-height: 130px; resize: vertical; }
    .button { justify-self: start; margin-top: 4px; padding: 15px 20px; color: var(--paper); background: var(--ink); border: 0; font: inherit; font-weight: 700; cursor: pointer; }
    .back { display: inline-block; margin-top: 22px; color: var(--coral); font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">TREVS DESIGN / ENQUIRY</p>
    <h1>Tell us about your project.</h1>
    <p>Complete the enquiry form with your name, email address, and project details. After you send it, you will continue to payment.</p>
    <a class="button" id="enquiry-link" href="https://formsubmit.co/el/bufelu?subject=New%20TREVS%20DESIGN%20enquiry">Continue to enquiry form</a>
    <a class="back" href="index.html">Back to homepage</a>
  </main>
  <script>
    const enquiryLink = document.querySelector('#enquiry-link');
    const formUrl = new URL(enquiryLink.href);
    formUrl.searchParams.set('next', new URL('payment.html', window.location.href).href);
    enquiryLink.href = formUrl.href;
  </script>
</body>
</html>
